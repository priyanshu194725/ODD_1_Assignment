<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form</title>
</head>
<body>

  <form action="submit.php" method="post">

    <p>
      <input type="text" name="fullname" placeholder="Full name"
             required minlength="3" maxlength="50">
    </p>

    <p>
      <input type="email" name="email" placeholder="you@college.edu" required>
    </p>

    <p>
      <input type="tel" name="mobile" placeholder="10-digit mobile"
             required pattern="[0-9]{10}" title="Enter exactly 10 digits">
    </p>

    <p>
      <input type="password" name="password" placeholder="Min 6 characters"
             required minlength="6" maxlength="20">
    </p>

    <p>
      <input type="number" name="age" placeholder="Age (17-30)"
             required min="17" max="30">
    </p>

    <p>
      <button type="submit">Register</button>
    </p>

  </form>

</body>
</html>
