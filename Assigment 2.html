<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Headings, Paragraphs, Formatting, and Spacial characters</title>
</head>
<body>
    <h1>Heading 1</h1>
    <h2>Heading 2</h2>
    <h3>Heading 3</h3>
    <br>
    <p>Text with <b>bold</b>, <i>italic</i>, <u>underline</u>, <mark>mark</mark>, H<sub>2</sub>O, X<sup>2</sup></p>
    <br>
    <p>&copy;  &reg;  &trade;  &lt;tag&gt;  &amp;  &euro;  &#8377;  &hearts;</p>
    <hr>
    <p>Linne one</p> 
    <p>Linne two</p>
</body>
</html>
