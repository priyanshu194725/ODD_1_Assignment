<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABC College Admission 2026</title>
  <style>
    body {
      margin: 0;
      font-family: serif;
    }

    header,
    footer {
      background-color: #1a237e;
      color: white;
      text-align: center;
    }

    header {
      padding: 30px 20px;
    }

    header h1 {
      margin: 0;
    }

    footer {
      padding: 12px;
    }

    main {
      max-width: 610px;
      margin: 0 auto;
      padding: 20px 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }

    th,
    td {
      border: 1px solid #999;
      padding: 8px;
      text-align: left;
    }

    th {
      background-color: #e8eaf6;
      text-align: center;
    }

    fieldset {
      padding: 10px 14px;
    }

    form p {
      margin: 0 0 18px;
    }

    textarea {
      width: 100%;
      max-width: 500px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <header>
    <h1>ABC College Admission 2026</h1>
  </header>

  <main>
    <section>
      <h2>Courses and Fees</h2>

      <table>
        <caption>Available Courses</caption>
        <thead>
          <tr>
            <th>Course</th>
            <th>Seats</th>
            <th>Fees</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>B.Tech CSE</td>
            <td>120</td>
            <td>&#8377;90,000</td>
          </tr>
          <tr>
            <td>BCA</td>
            <td>60</td>
            <td>&#8377;45,000</td>
          </tr>
        </tbody>
      </table>
    </section>

    <section>
      <form action="submit.php" method="post">
        <fieldset>
          <legend>Application Form</legend>

          <p>
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name" required minlength="3" maxlength="50">
          </p>

          <p>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required>
          </p>

          <p>
            <label for="course">Course:</label><br>
            <select id="course" name="course" required>
              <option value="btech-cse">B.Tech CSE</option>
              <option value="bca">BCA</option>
            </select>
          </p>

          <p>
            <label for="statement">Statement:</label><br>
            <textarea id="statement" name="statement" rows="4" cols="50" maxlength="500"></textarea>
          </p>

          <p>
            <button type="submit">Apply</button>
          </p>
        </fieldset>
      </form>
    </section>
  </main>

  <footer>
    <p style="margin: 0;">&copy; 2026 ABC College</p>
  </footer>

</body>
</html>
