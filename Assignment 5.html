<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unordered,Ordered Lists and Description Lists</title>
</head>
<body>
    <h1>Unordered</h1>
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>
    <h2>Ordered</h2>
    <ol>
        <li>Apple</li>
        <li>Banana</li>
        <li>Cherry</li>
    </ol>
    <h3>Description</h3>
    <dl> 
      <dt>HTML</dt> 
      <dd>HyperText Markup Laguage</dd> 
      <dt>CSS</dt> 
      <dd>Cascading Style Sheets</dd>
    </dl>
</body>
</html>
